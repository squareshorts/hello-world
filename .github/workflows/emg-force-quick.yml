name: EMG force quick
on:
  push:
    branches: [emg-force-quick-20260910]
jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-quick.txt
      - run: python quick.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quick-results
          path: results/
          if-no-files-found: warn
