name: CEMHSEY multi-subject longitudinal replication
on:
  push:
    branches: [cemhsey-longitudinal-pilot-20260910]
    paths:
      - 'cemhsey_subject_wrapper.py'
      - '.github/workflows/cemhsey-multisubject.yml'
jobs:
  subject:
    strategy:
      fail-fast: false
      matrix:
        subject: [2, 3, 4, 5]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUBJECT: ${{ matrix.subject }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-cemhsey.txt
      - run: python cemhsey_subject_wrapper.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cemhsey-s${{ matrix.subject }}-11day-pilot
          path: results/
