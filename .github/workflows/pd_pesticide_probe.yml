name: PD pesticide MR data probe

on:
  push:
    branches:
      - pd-pesticide-mr-run-20260907

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download Blauwendraat sex-stratified PD archive
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 5 \
            -o /tmp/pd.zip \
            https://personal.broadinstitute.org/ryank/Blauwendraat_Parkinsons_sexdiff_2021.zip
          ls -lh /tmp/pd.zip
      - name: List archive contents
        run: |
          set -euo pipefail
          unzip -l /tmp/pd.zip | tee /tmp/pd_zip_listing.txt
      - name: Upload archive listing
        uses: actions/upload-artifact@v4
        with:
          name: pd-zip-listing
          path: /tmp/pd_zip_listing.txt
          retention-days: 1
