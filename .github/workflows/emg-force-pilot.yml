name: EMG force pilot

on:
  push:
    branches:
      - emg-force-pilot-20260910
  workflow_dispatch:

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-emg-force.txt
      - name: Install dependencies
        run: pip install -r requirements-emg-force.txt
      - name: Run longitudinal pilot
        run: python scripts/emg_force_pilot.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emg-force-pilot-results
          path: results/
          if-no-files-found: warn
