name: EMG force S3
on:
  push:
    branches: [emg-force-s3-20260910]
jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-quick.txt
      - name: Fetch Hyser trial files from PhysioNet S3
        run: |
          set -e
          for s in 1 2; do
            mkdir -p _quick_data/subject01_session${s}
            for k in 1 2; do
              for kind in preprocess force; do
                stem=ndof_${kind}_combination15_sample${k}
                for ext in hea dat; do
                  aws s3 cp --no-sign-request s3://physionet-open/hd-semg/2.0.0/ndof_dataset/subject01_session${s}/${stem}.${ext} _quick_data/subject01_session${s}/${stem}.${ext} --only-show-errors
                done
              done
            done
          done
      - run: python quick.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s3-quick-results
          path: results/
          if-no-files-found: warn
