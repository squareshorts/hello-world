name: EMG force regularized
on:
  push:
    branches: [emg-force-regularized-20260910]
jobs:
  subject:
    strategy:
      fail-fast: false
      matrix:
        subject: ['01','02','03','04','05']
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUBJECT: ${{ matrix.subject }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-regularized.txt
      - name: Fetch selected Hyser trials
        run: |
          set -e
          for s in 1 2; do
            mkdir -p _data/subject${SUBJECT}_session${s}
            for combo in 1 8 15; do
              for k in 1 2; do
                for kind in preprocess force; do
                  stem=ndof_${kind}_combination${combo}_sample${k}
                  for ext in hea dat; do
                    aws s3 cp --no-sign-request s3://physionet-open/hd-semg/2.0.0/ndof_dataset/subject${SUBJECT}_session${s}/${stem}.${ext} _data/subject${SUBJECT}_session${s}/${stem}.${ext} --only-show-errors
                  done
                done
              done
            done
          done
      - run: python regularized.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regularized-subject-${{ matrix.subject }}
          path: results/
          if-no-files-found: warn
