name: CEMHSEY S1 Day9 diagnostic
on:
  push:
    branches: [cemhsey-longitudinal-pilot-20260910]
    paths:
      - 'cemhsey_day9_diagnostic.py'
      - '.github/workflows/cemhsey-day9-diagnostic.yml'
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-cemhsey.txt
      - run: python cemhsey_day9_diagnostic.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cemhsey-s1-day9-diagnostic
          path: results/
